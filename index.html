<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sarthak Gupta | Portfolio</title>
<style>
:root{--bg:#0a0305;--red:#ff2a1a;--org:#ff8a1f;--txt:#f4eae6;--mute:#b79d98;--line:rgba(255,70,40,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;color-scheme:dark}
body{background:var(--bg);color:var(--txt);font-family:"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
main,nav{position:relative;z-index:1}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(10,3,5,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
nav b{letter-spacing:.2em;color:var(--red)}
nav a{color:var(--txt);text-decoration:none;margin-left:18px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
nav a:hover{color:var(--org)}
section{padding:90px 5vw;max-width:1100px;margin:auto}
.hero{min-height:92vh;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.tag{color:var(--org);font-size:12px;letter-spacing:.25em;text-transform:uppercase}
h1{font-size:clamp(44px,8vw,96px);line-height:.95;font-weight:900;margin:14px 0 18px;text-shadow:0 0 30px rgba(255,42,26,.6)}
h1 span{color:var(--red)}
h2{font-size:clamp(32px,5vw,56px);font-weight:900;text-transform:uppercase;margin:8px 0 14px}
p{color:var(--mute);line-height:1.6;max-width:560px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{padding:12px 22px;border:1px solid var(--red);color:var(--txt);text-decoration:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);background:rgba(255,42,26,.12);transition:.2s}
.btn:hover,.btn.f{background:var(--red);box-shadow:0 0 24px var(--red)}
.frame{position:relative;aspect-ratio:4/5;border:1px solid var(--line);clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px);background:radial-gradient(circle at 50% 38%,var(--org),var(--red) 35%,#2a0508 70%);overflow:hidden;cursor:pointer}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}.hud{position:absolute;left:16px;font-size:10px;letter-spacing:.25em;color:#ffb199;z-index:2}.hud.t{top:14px}.hud.b{bottom:14px}
.frame .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;letter-spacing:.2em;color:#fff;text-transform:uppercase;text-shadow:0 0 10px #000}
.visor{position:absolute;left:30%;right:22%;top:29%;height:3.6%;transform:rotate(-8deg);background:linear-gradient(90deg,transparent,#ffd45a,#fff,#ffd45a,transparent);box-shadow:0 0 25px 8px var(--org),0 0 70px 20px var(--red);border-radius:6px;animation:p 3s infinite}
@keyframes p{50%{opacity:.75;box-shadow:0 0 40px 14px var(--org),0 0 100px 30px var(--red)}}
.frame i{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.5);top:78%;transform:rotate(-8deg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:30px}
.card{border:1px solid var(--line);padding:22px;background:rgba(255,42,26,.06);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:.25s}
.card:hover{transform:translateY(-6px);background:rgba(255,42,26,.16);box-shadow:0 0 30px rgba(255,42,26,.3)}
.card b{display:block;font-size:34px;color:var(--org)}
.card h3{font-size:18px;margin:6px 0;text-transform:uppercase}
.card p{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:30px}
.tl{margin-top:30px;border-left:2px solid var(--red);padding-left:22px;display:grid;gap:22px}
.tl div{position:relative}
.tl div:before{content:"";position:absolute;left:-29px;top:6px;width:10px;height:10px;background:var(--org);box-shadow:0 0 12px var(--org);border-radius:50%}
.tl b{display:block;margin-bottom:4px}
.bars{display:grid;gap:14px;margin-top:30px;max-width:560px}
.bar{font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.bar u{display:block;height:6px;margin-top:6px;background:#2a0f12;text-decoration:none}
.bar u:after{content:"";display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--red),var(--org));box-shadow:0 0 10px var(--red)}
.big{font-size:clamp(40px,9vw,110px);font-weight:900;text-transform:uppercase;line-height:1;color:var(--red);text-shadow:0 0 30px rgba(255,42,26,.5)}
form{display:grid;gap:12px;margin-top:26px;max-width:520px}
input,textarea{background:rgba(255,42,26,.08);border:1px solid var(--line);color:var(--txt);padding:13px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--org);box-shadow:0 0 14px rgba(255,138,31,.4)}
footer{position:relative;z-index:1;text-align:center;padding:30px 5vw;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(30px);transition:.8s}.rv.on{opacity:1;transform:none}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:30px}nav a{margin-left:10px;font-size:11px}}

.frame img.fx{filter:grayscale(1) contrast(1.5) brightness(.6);mix-blend-mode:multiply}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:30px}
.cert{border:1px solid var(--line);background:rgba(255,42,26,.06);cursor:zoom-in;overflow:hidden}
.cert img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.cert span{display:block;padding:12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:50;padding:20px}
#lb img{max-width:100%;max-height:90vh}
#adminbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:none}
#ap{position:fixed;inset:0;z-index:60;background:rgba(6,2,3,.97);overflow:auto;display:none;padding:calc(20px + env(safe-area-inset-top,0px)) 5vw 60px}
#ap h3{color:var(--org);margin:26px 0 10px;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
#ap label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
#ap input,#ap textarea{width:100%}
#ap .row{border:1px solid var(--line);padding:12px;margin-bottom:12px;background:rgba(255,42,26,.05)}
#ap .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#060203;padding:10px 0;z-index:2}
#ap img.pv{max-width:160px;display:block;margin:8px 0;border:1px solid var(--line)}
#ap .btn{cursor:pointer;color:#fff;font:inherit;font-size:12px}
.bd{display:inline-block;min-width:44px;text-align:center;padding:8px 10px;margin-bottom:8px;background:rgba(255,42,26,.18);border:1px solid var(--line);color:var(--org);font-weight:800;font-size:13px;letter-spacing:.08em}
.sm{padding:6px 12px!important;font-size:11px!important}

</style>
</head>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),app=$('#app');
const e=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
const n=S.name.split(' ');
app.innerHTML=`
<section class="hero" id="home"><div>
<div class="tag">${e(S.tag)}</div><div class="tag" style="color:var(--mute);margin-top:6px">${e(S.tag2)}</div>
<h1>${e(n[0]).toUpperCase()}<br><span>${e(n.slice(1).join(' ')).toUpperCase()}.</span></h1>
<p>${e(S.intro)}</p>
<div class="btns"><a class="btn f" href="#about">Explore my journey ↗</a><a class="btn" href="#contact">Get in touch</a></div></div>
<div class="frame"><img class="${S.hero.fx?'fx':''}" alt="${e(S.name)}" src="${e(S.hero.img)}"><div class="visor"></div><i></i><span class="hud t">SYS // ONLINE</span><span class="hud b">SX.RTH — 2026</span></div></section>
<section class="rv"><div class="stats">${S.stats.map(x=>{const v=x[0]==='certs'?S.certs.length:x[0];return `<div class="card"><b data-n="${+v||0}">${+v?0:e(v)}</b><p>${e(x[1])}</p></div>`}).join('')}</div></section>
<section id="about" class="rv"><div class="tag">01 / About</div><h2>Who I am.</h2>
<p>${e(S.p1)}</p><p style="margin-top:10px">${e(S.p2)}</p>
<div class="grid">${S.cards.map(c=>`<div class="card"><h3>${e(c.t)}</h3><p>${e(c.p)}</p></div>`).join('')}</div></section>
<section id="interests" class="rv"><div class="tag">02 / Areas I explore</div><h2>Curiosity in motion.</h2>
<p>A mix of analytical thinking, hands-on experimentation and creative expression.</p>
<div class="grid">${S.interests.map(c=>`<div class="card"><h3>${e(c.t)}</h3><p>${e(c.p)}</p><p style="margin-top:8px;color:var(--org)">${e(c.tag)}</p></div>`).join('')}</div></section>
<section id="journey" class="rv"><div class="tag">03 / Learning &amp; participation</div><h2>Building my foundation.</h2>
<p>Milestones that reflect my willingness to learn beyond the classroom.</p>
<div class="tl">${S.journey.map(c=>`<div><span class="bd">${e(c.b)}</span><b>${e(c.t)}</b><p>${e(c.p)}</p></div>`).join('')}</div></section>
<section id="certs" class="rv"><div class="tag">04 / Certificates</div><h2>Proof of learning.</h2>
${S.certs.length?`<div class="certs">${S.certs.map(c=>`<div class="cert" data-u="${e(c.img)}"><img src="${e(c.img)}" alt="${e(c.t)}"><span>${e(c.t)}</span></div>`).join('')}</div>`:'<p>Certificates will appear here soon.</p>'}</section>
<section class="rv"><div class="tag">A work in progress</div><div class="big">${e(S.bigT)}</div><p style="margin-top:16px">${e(S.bigP)}</p></section>
<section id="contact" class="rv"><div class="tag">05 / Contact</div><h2>Let’s connect.</h2><p>${e(S.contact)}</p>
<form onsubmit="event.preventDefault();this.querySelector('button').textContent='Sent ✓'"><input placeholder="Your name" required><input type="email" placeholder="Your email" required><textarea rows="4" placeholder="Say hello…"></textarea><button class="btn f" style="cursor:pointer;color:#fff">Send message ↗</button></form>
<div class="btns"><a class="btn" href="${e(S.ig)}">Instagram ↗</a><a class="btn" href="mailto:${e(S.email)}">Email ↗</a></div></section>`;
$('#fn').textContent=S.name;
app.querySelectorAll('.rv').forEach(x=>io.observe(x));
app.querySelectorAll('.cert').forEach(x=>x.onclick=()=>{$('#lb img').src=x.dataset.u;$('#lb').style.display='grid'});
}
$('#lb').onclick=()=>$('#lb').style.display='none';
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('on');x.target.querySelectorAll('[data-n]').forEach(n=>{const t=+n.dataset.n;let v=0;const s=Math.max(1,t/50);const id=setInterval(()=>{v=Math.min(t,v+s);n.textContent=Math.round(v);if(v>=t)clearInterval(id)},30)});io.unobserve(x.target)}}),{threshold:.15});
render();
/* background embers */
const c=$('#c'),x=c.getContext('2d');let W,H,ps=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.5,v:Math.random()*.4+.1});
let lt=0;(function d(){x.clearRect(0,0,W,H);ps.forEach(q=>{q.y-=q.v;if(q.y<0){q.y=H;q.x=Math.random()*W}x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fillStyle='rgba(255,70,30,.6)';x.shadowBlur=12;x.shadowColor='#ff2a1a';x.fill()});requestAnimationFrame(d)})();
/* electric spark tap effect */
const sp=document.createElement('canvas');sp.id='sp';sp.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none';document.body.appendChild(sp);const sx=sp.getContext('2d');let sparks=[],srun=false;
function rz(){sp.width=innerWidth;sp.height=innerHeight}rz();addEventListener('resize',rz);
function bolt(x,y){const a=Math.random()*6.283,L=40+Math.random()*90,n=7,pts=[[x,y]];let px=x,py=y;for(let i=0;i<n;i++){const aa=a+(Math.random()-.5)*1.1;px+=Math.cos(aa)*L/n;py+=Math.sin(aa)*L/n;pts.push([px,py])}return pts}
function mk(s){s.bolts=Array.from({length:8},()=>bolt(s.x,s.y));s.lt=performance.now()}
function fr(now){sx.clearRect(0,0,sp.width,sp.height);sparks=sparks.filter(s=>now-s.t<450);sparks.forEach(s=>{if(now-s.lt>70)mk(s);const k=1-(now-s.t)/450;sx.globalAlpha=k;sx.lineCap='round';sx.lineJoin='round';s.bolts.forEach(b=>{sx.beginPath();b.forEach((p,i)=>i?sx.lineTo(p[0],p[1]):sx.moveTo(p[0],p[1]));sx.shadowColor='#ff5a1f';sx.shadowBlur=18;sx.strokeStyle='#ff6a2a';sx.lineWidth=3;sx.stroke();sx.shadowBlur=6;sx.strokeStyle='#fff';sx.lineWidth=1.2;sx.stroke()});sx.beginPath();sx.arc(s.x,s.y,7*k+2,0,7);sx.fillStyle='#fff';sx.shadowBlur=26;sx.fill()});sx.globalAlpha=1;if(sparks.length)requestAnimationFrame(fr);else{srun=false;sx.clearRect(0,0,sp.width,sp.height)}}
addEventListener('pointerdown',ev=>{if(RM)return;const s={x:ev.clientX,y:ev.clientY,t:performance.now()};mk(s);sparks.push(s);if(!srun){srun=true;requestAnimationFrame(fr)}});

.then(r=>r.json()).then(rows=>{if(rows&&rows[0]&&rows[0].data){Object.assign(S,rows[0].data);render()}}).catch(()=>{});
